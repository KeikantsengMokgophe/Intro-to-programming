<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ch14 - pizzeria</title>
    <link rel="stylesheet" href="pizzeria.css" />
</head>

<body>
    <h1>Kantse JS Pizzeria</h1>

    <div id="orderForm">
        <label>How many pizzas do you want?
            <input type="number" id="numPizzas" />
        </label>
        <br />
        <br />
        <label>What kind of pizzas?
            <select id="typePizza">
                <option value="cheese">Cheese</option>
                <option value="pepperoni">Pepperoni</option>
                <option value="choice">Veggie</option>
                <option value="meat">Chicken</option>
                <option value="HI">Pineapple</option>
                <option value="supreme">Supreme</option>
                <option value="allergy">Gluten-Free</option>
                <option valu="Chicken bbq"> Chicken</option>
            </select>
        </label>
        <br />
        <br />
        <label>Where do you live?
            <select id="deliveryCity">
                <option value="Anytown">Anytown</option>
                <option value="SJ">San Jose</option>
                <option value="SV">Sunnyvale</option>
                <option value="PA">Palo Alto</option>
                <option value="SC">Santa Clara</option>
                <option value="pretoria north"> pretoria</option>
                <option value="north west"> north west</option>
            </select>
        </label>
        <br />
        <br />
        <label>Is it your birthday?
            <select id="birthday">
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select>
        </label>
        <br />
        <br />
        <button type="button" id="placeOrder">Place Order</button>
    </div>
    <div id="displayTotal"></div>
    <script src="pizzeria.js"></script>

</body>

</html>
